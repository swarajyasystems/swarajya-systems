<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>सदस्य नोंदणी - स्वराज्य सिस्टीम्स</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img src="Logo_2.jpg" alt="स्वराज्य सिस्टीम्स लोगो" class="h-12">
        <span class="text-xl font-bold text-blue-900">स्वराज्य सिस्टीम्स</span>
      </div>
      <nav class="space-x-6 hidden md:block font-medium">
        <a href="index.html" class="hover:text-orange-600">मुख्य पृष्ठ</a>
        <a href="about.html" class="hover:text-orange-600">आमच्याबद्दल</a>
        <a href="products.html" class="hover:text-orange-600">उत्पादने</a>
        <a href="business.html" class="hover:text-orange-600">व्यवसाय संधी</a>
        <a href="register.html" class="text-orange-600 font-bold">नोंदणी करा</a>
      </nav>
    </div>
  </header>

  <section class="max-w-xl mx-auto py-12 px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg border border-slate-100">
      <h2 class="text-2xl font-bold text-blue-900 mb-6 text-center">नवीन सदस्य नोंदणी फॉर्म</h2>
      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">पूर्ण नाव</label>
          <input type="text" placeholder="तुमचे नाव" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">मोबाईल नंबर</label>
          <input type="tel" placeholder="१० अंकी मोबाईल नंबर" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">पत्ता</label>
          <textarea placeholder="पूर्ण पत्ता" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" rows="3" required></textarea>
        </div>
        <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg shadow">फॉर्म सबमिट करा</button>
      </form>
    </div>
  </section>

</body>
</html>
